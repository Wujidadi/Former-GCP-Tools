Define FGT_DOCROOT /home/wujidadi/workspace/Former-GCP-Tools/.output/public

Listen 84

<VirtualHost *:84>
    ServerAdmin wujidadi@gmail.com
    DocumentRoot ${FGT_DOCROOT}

    <Directory ${FGT_DOCROOT}>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # 經 Cloudflare 轉入時，mod_dir 補斜線的 301 會帶上 :84 而導向無法連線的網址
    DirectorySlash Off
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}/index.html -f
    RewriteRule ^(.*?)/?$ $1/index.html [L]

    ErrorDocument 404 /404.html

    <LocationMatch "^/_nuxt/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/former-gcp-tools.error.log
    CustomLog ${APACHE_LOG_DIR}/former-gcp-tools.access.log combined
</VirtualHost>
